name: Java visualizer checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: javac -d out src/DataStructureVisualizer.java tests/VisualizerTest.java tests/DesktopWindowTest.java
      - name: Core checks
        run: java "-Djava.awt.headless=true" -cp out VisualizerTest
      - name: Desktop checks on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1200x24' java -cp out DesktopWindowTest
      - name: Desktop checks on Windows
        if: runner.os == 'Windows'
        run: java -cp out DesktopWindowTest
      - name: Save window screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots-${{ matrix.os }}
          path: desktop-screenshots/
          if-no-files-found: ignore
